name: Build Secure
inputs:
  app-token:
    type: string
    required: true

# Secure execution of continuous integration jobs
# which are performed upon completion of the
# "Continuous Integration" workflow
# https://securitylab.github.com/research/github-actions-preventing-pwn-requests/

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: yarn
    - run: yarn install --frozen-lockfile --non-interactive
      shell: bash

    - uses: actions/download-artifact@v8
      with:
        name: docs
        path: dist/docs/
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ inputs.app-token }}

    - name: Prepare configuration for container build
      run: yarn prepare-container
      shell: bash

    - name: Create size check
      uses: actions/github-script@v9
      with:
        script: |
          const { title, summary, text } = await import('${{ github.action_path }}/compare-stats.ts');

          await github.rest.checks.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            name: 'Size Check',
            head_sha: context.payload.workflow_run.head_sha,
            output: { title, summary, text },
            status: 'completed',
            conclusion: 'success',
          });

    - name: Read Pull Request Number
      id: pr-number
      run: echo "result=$(cat dist/docs/pr)" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: "Remove 'preview-available' label"
      # This label is used for filtering deployments in ArgoCD.
      # At the start of the workflow, we remove the container available labels
      # which will be re-added after the Secure workflow.
      run: gh issue edit $PR_NUMBER --repo ${{ github.repository }} --remove-label "preview-available"
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ steps.pr-number.outputs.result }}
      shell: bash

    - name: Create GitHub Deployment
      uses: actions/github-script@v9
      env:
        PR_NUMBER: ${{ steps.pr-number.outputs.result }}
      with:
        script: |
          const environment = `pr${process.env.PR_NUMBER}`;
          const payload = { owner: context.repo.owner, repo: context.repo.repo, environment };
          const { data: deployment } = await github.rest.repos.createDeployment({
            ...payload,
            ref: context.payload.workflow_run.head_sha,
            auto_merge: false,
            required_contexts: ['build']
          });
          await github.rest.repos.createDeploymentStatus({
            ...payload,
            deployment_id: deployment.id,
            state: 'in_progress',
            environment_url: `https://${context.repo.repo}-${environment}.app.sbb.ch`,
          });

    - uses: sbb-design-systems/actions/build-container@main
      with:
        repository: docs-preview
        tag: pr${{ steps.pr-number.outputs.result }}

    - name: "Add 'preview-available' label"
      # This label is used for filtering deployments in ArgoCD
      run: gh issue edit $PR_NUMBER --add-label "preview-available"
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ steps.pr-number.outputs.result }}
      shell: bash
